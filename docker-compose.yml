version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: tket_postgres
    restart: always
    environment:
      POSTGRES_USER: tket_admin
      POSTGRES_PASSWORD: tket_db_password1234
      POSTGRES_DB: tket_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data


  redis:
    image: redis:alpine
    container_name: tket_redis
    restart: always
    ports:
      - "6379:6379"

volumes:
  postgres_data: